name: Build and Release EXE

# Runs when version.py changes on main (i.e. you bumped the version),
# or manually from the Actions tab ("Run workflow").
on:
  push:
    branches: [ main ]
    paths: [ 'version.py' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read version
        id: ver
        shell: bash
        run: |
          V=$(python -c "import version; print(version.APP_VERSION)")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V"

      - name: Skip if this version was already released
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "Release v${{ steps.ver.outputs.version }} already exists - bump APP_VERSION in version.py to publish a new one."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build EXE
        if: steps.check.outputs.exists == 'false'
        run: python build_exe.py

      - name: Publish GitHub Release
        if: steps.check.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          if [ -s RELEASE_NOTES.md ]; then
            gh release create "v$V" dist/PartsInventory.exe \
              --title "Parts Inventory v$V" --notes-file RELEASE_NOTES.md
          else
            gh release create "v$V" dist/PartsInventory.exe \
              --title "Parts Inventory v$V" --generate-notes
          fi
